name: Daily run (data, grading, predictions)

# 10:50 UTC: after sportsdataverse's nightly box-score job (07:00 UTC).
# The later runs pick up injury news and lock each game at tip-off.
# GitHub often starts scheduled runs late, so there are several.
on:
  schedule:
    - cron: "50 10 * * *"
    - cron: "45 13 * * *"   # sportsdataverse posts last night's box scores around 12:40 UTC
    - cron: "10 16 * * *"
    - cron: "10 21 * * *"
    - cron: "10 23 * * *"
    - cron: "40 0 * * *"
  workflow_dispatch: {}

concurrency:
  group: teleios-repo-write
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Daily run
        run: python -m teleios.daily
      - name: Commit and push
        run: |
          git config user.name "teleios-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data
          git diff --cached --quiet && { echo "nothing changed"; exit 0; }
          git commit -m "Daily run $(date -u +'%Y-%m-%d %H:%M UTC')"
          for i in 1 2 3 4 5; do
            git pull --rebase -X theirs origin main && git push && exit 0
            sleep $((i * 10))
          done
          exit 1
      - name: Build website (llslumpll.github.io/nba-teleios-analyst)
        if: always()
        run: |
          python -m teleios.bundle
          mkdir -p site
          cp chat/index.html chat/data.json site/
          touch site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        if: always()
        with:
          path: site

  deploy:
    needs: run
    if: always() && needs.run.result != 'cancelled'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
