name: Monthly retune

# 1st of each month: re-fit settings on recent games, adopt only if better
# on held-out games (teleios/retune.py). Logged in data/retune_log.json.
on:
  schedule:
    - cron: "20 12 1 * *"
  workflow_dispatch: {}

concurrency:
  group: teleios-repo-write
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  retune:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Refresh game margins used for blowout risk
        run: |
          python - <<'PY'
          import json
          from teleios import data
          from teleios.backtest import run_season, lineups_played
          from teleios.daily import load_params
          from teleios.model import Engine
          g, pg = data.games(), data.player_games()
          e = Engine(g, pg, load_params()); out = {}
          for s in (data.CURRENT_SEASON - 1, data.CURRENT_SEASON):
              for p in run_season(e, s, lineups_played(pg)):
                  out[str(p["game_id"])] = round(p["margin"], 2)
          old = json.loads((data.DATA / "game_margins_walkforward.json").read_text())
          (data.DATA / "game_margins_walkforward.json").write_text(json.dumps({**old, **out}))
          PY
      - name: Retune
        run: python -m teleios.retune
      - name: Commit and push
        run: |
          git config user.name "teleios-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data
          git diff --cached --quiet && exit 0
          git commit -m "Monthly retune $(date -u +'%Y-%m-%d')"
          for i in 1 2 3 4 5; do
            git pull --rebase -X theirs origin main && git push && exit 0
            sleep $((i * 10))
          done
          exit 1
